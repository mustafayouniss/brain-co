version: '3.8'

services:
  # ══════════════════════════════════════════════
  # Primary Relational & Vector Database
  # ══════════════════════════════════════════════
  postgres:
    image: pgvector/pgvector:pg15
    container_name: brain-co-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brainadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brainpass123}
      POSTGRES_DB: ${POSTGRES_DB:-organizational_brain}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/pgvector-setup.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brainadmin} -d ${POSTGRES_DB:-organizational_brain}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ══════════════════════════════════════════════
  # In-Memory Cache & Async Queue Buffer
  # ══════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: brain-co-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ══════════════════════════════════════════════
  # Legal Precedents & Citation Graph Database
  # ══════════════════════════════════════════════
  neo4j:
    image: neo4j:5-community
    container_name: brain-co-neo4j
    restart: always
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/brainpass123}
    ports:
      - "7474:7474" # HTTP UI
      - "7687:7687" # Bolt protocol
    volumes:
      - neo4j_data:/data

  # ══════════════════════════════════════════════
  # S3-Compatible Object Storage (Data Lake)
  # ══════════════════════════════════════════════
  minio:
    image: minio/minio:latest
    container_name: brain-co-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  minio_data:
