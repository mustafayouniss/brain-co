name: brain_co_mobile
description: "Organizational Brain Mobile App for Egyptian Legal Organizations (Lawyers & Clients)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  flutter_bloc: ^8.1.3
  get_it: ^7.6.0
  equatable: ^2.0.5

  # Networking & Real-Time
  dio: ^5.4.1
  socket_io_client: ^2.0.3+1
  connectivity_plus: ^5.0.2

  # Offline Storage & Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0

  # UI, Arabic Fonts & Styling
  google_fonts: ^6.1.0
  intl: ^0.19.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1

  # Security & Biometrics
  local_auth: ^2.1.8

  # Document Scanning & Camera
  camera: ^0.10.5+9
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  bloc_test: ^9.1.5
  mocktail: ^1.0.3
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
